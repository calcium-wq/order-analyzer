<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Analyseur de Commandes IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
        }

        .file-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            font-size: 0.9em;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            margin: 15px 0;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            color: #2e7d32;
            font-weight: 500;
            display: none;
        }

        .file-name.show {
            display: block;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .analyze-btn.show {
            display: block;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            margin: 20px 0;
            text-align: center;
        }

        .loader.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            color: #333;
            margin-bottom: 15px;
        }

        .results pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Analyseur de Commandes IA</h1>
            <p>Téléchargez votre fichier CSV pour une analyse intelligente</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="file-icon">📊</div>
            <div class="upload-text">Glissez-déposez votre fichier CSV ici</div>
            <div class="upload-subtext">ou cliquez pour sélectionner un fichier</div>
            <input type="file" id="csvFile" accept=".csv">
        </div>

        <div class="file-name" id="fileName">
            ✅ Fichier sélectionné : <span id="fileNameText"></span>
        </div>

        <button class="analyze-btn" id="analyzeBtn">
            🔍 Analyser les commandes
        </button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Analyse en cours... Veuillez patienter</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <h2>📊 Résultats de l'analyse</h2>
            <pre id="resultText"></pre>
        </div>
    </div>

    <script>
        // 🔴 REMPLACE CETTE URL PAR TON URL WEBHOOK N8N EN PRODUCTION
        const WEBHOOK_URL = 'https://calmakasi.app.n8n.cloud/webhook/analyze-orders';

        const uploadArea = document.getElementById('uploadArea');
        const csvFile = document.getElementById('csvFile');
        const fileName = document.getElementById('fileName');
        const fileNameText = document.getElementById('fileNameText');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loader = document.getElementById('loader');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const resultText = document.getElementById('resultText');

        // Gestion du clic sur la zone d'upload
        uploadArea.addEventListener('click', () => {
            csvFile.click();
        });

        // Gestion du drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // Gestion de la sélection de fichier
        csvFile.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.name.endsWith('.csv')) {
                showError('Veuillez sélectionner un fichier CSV valide');
                return;
            }

            fileNameText.textContent = file.name;
            fileName.classList.add('show');
            analyzeBtn.classList.add('show');
            hideError();
            results.classList.remove('show');
        }

        // Analyse du fichier
        analyzeBtn.addEventListener('click', async () => {
            const file = csvFile.files[0];
            
            if (!file) {
                showError('Veuillez sélectionner un fichier CSV');
                return;
            }

            // Préparer les données
            const formData = new FormData();
            formData.append('file', file);

            // Afficher le loader
            loader.classList.add('show');
            analyzeBtn.disabled = true;
            hideError();
            results.classList.remove('show');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const result = await response.json();

                // Afficher les résultats
                if (result.analyse) {
                    resultText.textContent = result.analyse;
                    results.classList.add('show');
                } else {
                    showError('Aucune analyse reçue du serveur');
                }

            } catch (err) {
                console.error('Erreur:', err);
                showError('Erreur lors de l\'analyse. Vérifiez que votre URL webhook n8n est correcte.');
            } finally {
                loader.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }
    </script>
</body>
</html>
